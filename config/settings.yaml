# Volman 70 Tick Bot - Production Configuration

mt5:
  login: 0  # Your MT5 account number (Set to 0 to use already logged-in terminal)
  password: ""  # Your MT5 password (Leave empty if already logged-in)
  server: ""  # Your MT5 server name (Leave empty if already logged-in)
  magic: 701970
  broker_gmt_offset: 2  # GMT offset of broker (EET/GMT+2 is standard for most brokers)

trading:
  symbol: "EURUSD"
  tick_count: 70
  volume: 0.1
  max_trades_session: 5
  max_consecutive_losses: 3
  stop_loss_fallback_pips: 6.5
  take_profit_multiplier: 1.2
  max_spread_pips: 1.5

sessions:
  use_session_filter: true
  london:
    start: "12:30"
    end: "16:30"
  new_york:
    start: "18:30"
    end: "21:30"

logging:
  level: "INFO"
  log_to_file: true
  log_file_path: "logs/volman_bot.log"
  backup_count: 5
